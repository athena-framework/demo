services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: unless-stopped
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=blog_user
      - POSTGRES_PASSWORD=mYAw3s0meB!og
      - POSTGRES_DB=postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./src/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
  mercure:
    image: dunglas/mercure:v1.1
    container_name: mercure-hub
    restart: unless-stopped
    environment:
      SERVER_NAME: ':80' # Disable HTTPS for local dev
      MERCURE_PUBLISHER_JWT_KEY: '!ChangeThisMercureHubJWTSecretKey!'
      MERCURE_SUBSCRIBER_JWT_KEY: '!ChangeThisMercureHubJWTSecretKey!'
      MERCURE_TRUSTED_ISSUERS: 'https://localhost' # The `MERCURE_JWT_ISSUER` of the Athena Server
      MERCURE_EXTRA_DIRECTIVES: |
        playground # Enable dev mode
        cors_origins http://localhost:3000 # Allow Athena Server
    ports:
      - '80:80'
    volumes:
      - mercure_data:/data
      - mercure_config:/config

volumes:
  postgres-data:
  mercure_data:
  mercure_config:
